[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mgatk2"
version = "1.3.0"
description = "Mitochondrial genome analysis toolkit for single-cell data"
readme = "README.md"
authors = [{name = "Oliver Knight", email = "oliver.knight@charite.de"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pysam>=0.19",
    "numpy>=1.20",
    "tqdm>=4.50",
    "h5py>=3.0",
    "matplotlib>=3.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=7", "ruff>=0.5", "setuptools>=77", "wheel"]

[project.urls]
Repository = "https://github.com/ollieeknight/mgatk2"

[project.scripts]
mgatk2 = "cli.base:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
data = ["blacklists/*.bed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "N", "PIE", "T20", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
