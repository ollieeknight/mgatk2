name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install
      run: pip install -e .[dev]

    - name: Test
      run: pytest -q

    - name: End-to-end fixtures
      run: make e2e BIN=

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip

    # Installing the built wheel rather than the source tree is what catches a
    # module missing from the package: an editable install always finds it.
    - name: Build and smoke-test the wheel
      run: |
        pip install build
        python -m build
        pip install dist/*.whl
        mgatk2 --help
        mgatk2 paired --help

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip

    - name: Lint
      run: |
        pip install ruff vulture
        ruff check src/ tests/
        ruff format --check src/ tests/
        vulture src tests
