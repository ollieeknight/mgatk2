name: Build and push Docker image to Quay.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Outputs record the pyproject version, so a tag that disagrees with it
      # would publish an image whose VCFs claim the previous release.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $package_version" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: quay.io/ollieeknight/mgatk2
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest moves only when a release tag is genuinely pushed. A manual
            # dispatch republishes that version's own tags and leaves latest alone,
            # so replaying an old release cannot hijack it.
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

      # A dispatch from a branch matches no tag rule, so the build would push
      # nothing and still report success. Fail instead of publishing silence.
      - name: Require a release tag
        if: steps.meta.outputs.tags == ''
        run: |
          echo "No image tags resolved. Run this workflow from a v* tag." >&2
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
